
<!DOCTYPE html>
<html>

<head>

    <title>Student Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="form-page">

<div class="form-card">

    <div class="logo">
        CAMPUS<span>VOTE</span>
    </div>

    <h1>Student Login</h1>

    <p>Login to cast your CR election vote.</p>

    {% if message %}
        <div class="error">
            {{ message }}
        </div>
    {% endif %}

    <form method="POST">

        <input type="text"
               name="roll_no"
               placeholder="Roll Number"
               required>

        <input type="password"
               name="password"
               placeholder="Password"
               required>

        <button type="submit">
            LOGIN & VOTE
        </button>

    </form>

    <p>
        New student?
        <a href="/register">Register here</a>
    </p>

    <a href="/">← Back to Home</a>

</div>

</body>

</html>
